<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ec">
  <meta name="description" content="一只鹈鹕，一辆自行车，一段悠闲的海边时光。">
  <link rel="icon" href="data:,">
  <title>鹈鹕的海边骑行</title>
  <style>
    :root { color-scheme: light; --paper: #f6f4ec; --ink: #283e3c; --muted: #68776f; --line: #d9ddd0; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
    button { font: inherit; }
    [hidden] { display: none !important; }
    .page { width: min(100% - 64px, 1000px); margin: 0 auto; }
    .masthead { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 28px 0 21px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; letter-spacing: .15em; }
    .brand-mark { width: 27px; height: 27px; }
    .edition { color: var(--muted); font-size: 10px; letter-spacing: .15em; }
    .intro { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; padding: 36px 0 26px; }
    .eyebrow { margin: 0 0 9px; color: var(--muted); font-size: 11px; letter-spacing: .18em; }
    h1 { margin: 0; font-size: clamp(27px, 4.5vw, 43px); font-weight: 600; letter-spacing: .025em; line-height: 1.4; }
    .subtitle { margin: 10px 0 0; font-size: 13px; color: var(--muted); line-height: 1.8; }
    .control { display: inline-flex; align-items: center; justify-content: center; gap: 9px; flex-shrink: 0; min-height: 44px; padding: 11px 17px; border: 1px solid var(--ink); border-radius: 100px; color: var(--paper); background: var(--ink); cursor: pointer; font-size: 12px; }
    .control:hover { background: #3b5650; }
    .control:focus-visible { outline: 3px solid #b36b36; outline-offset: 5px; }
    .control-icon { width: 14px; height: 14px; fill: currentColor; }
    .scene { margin: 0; border: 1px solid #d1dcd4; border-radius: 20px; overflow: hidden; background: #dcebe8; }
    .scene > svg { width: 100%; height: auto; display: block; }
    .caption { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 17px 0 29px; color: var(--muted); font-size: 11px; line-height: 1.7; }
    .caption-text { display: flex; align-items: center; gap: 8px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #698c76; flex-shrink: 0; }
    .caption-index { letter-spacing: .12em; white-space: nowrap; }
    @media (max-width: 600px) {
      .page { width: calc(100% - 32px); }
      .masthead { padding: 20px 0 16px; }
      .edition { font-size: 9px; letter-spacing: .06em; }
      .brand { font-size: 12px; }
      .intro { align-items: flex-start; flex-wrap: wrap; padding: 27px 0 20px; gap: 16px; }
      .subtitle { font-size: 12px; }
      .scene { border-radius: 14px; }
      .caption { align-items: flex-start; font-size: 10px; }
    }
  </style>
</head>
<body>

      <div class="caption">

  </main>
  <script>
    (() => {
      'use strict';

      const geometry = {
        hip: { x: 450, y: 342 },
        crank: { x: 475, y: 463 },
        crankRadius: 28,
        upperLeg: 85,
        lowerLeg: 85,
        wheelRadius: 82,
        wheelRatio: 2,
        period: 2400,
        roadSpacing: 120
      };
      const byId = (id) => document.getElementById(id);
      const button = byId('playback');
      const label = byId('playback-label');
      const pauseIcon = byId('pause-icon');
      const playIcon = byId('play-icon');
      const wheels = [byId('rear-spokes'), byId('front-spokes')];
      const road = byId('road-lines');
      const limbs = ['near', 'far'].map((side) => ({
        leg: byId(`${side}-leg`),
        outline: byId(`${side}-leg-outline`),
        crank: byId(`${side}-crank`),
        foot: byId(`${side}-foot`)
      }));
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      let playing = !motionPreference.matches;
      let elapsed = 0;
      let previousTimestamp = null;
      let frameId = null;

      const coordinate = (value) => value.toFixed(3);

      function drawLeg(limb, angle) {
        const { hip, crank, crankRadius, upperLeg, lowerLeg } = geometry;
        const foot = {
          x: crank.x + crankRadius * Math.cos(angle),
          y: crank.y + crankRadius * Math.sin(angle)
        };
        const dx = foot.x - hip.x;
        const dy = foot.y - hip.y;
        const actualDistance = Math.max(Math.hypot(dx, dy), 0.001);
        // Keep the chosen knee bend consistent throughout the pedal cycle.
        const distance = Math.max(
          Math.abs(upperLeg - lowerLeg) + 0.001,
          Math.min(actualDistance, upperLeg + lowerLeg - 0.001)
        );
        const ux = dx / actualDistance;
        const uy = dy / actualDistance;
        const projection = (upperLeg ** 2 - lowerLeg ** 2 + distance ** 2) / (2 * distance);
        const bend = Math.sqrt(Math.max(0, upperLeg ** 2 - projection ** 2));
        const knee = {
          x: hip.x + projection * ux + bend * uy,
          y: hip.y + projection * uy - bend * ux
        };
        const path = `M${hip.x} ${hip.y} L${coordinate(knee.x)} ${coordinate(knee.y)} L${coordinate(foot.x)} ${coordinate(foot.y)}`;
        limb.leg.setAttribute('d', path);
        limb.outline.setAttribute('d', path);
        limb.crank.setAttribute('d', `M${crank.x} ${crank.y} L${coordinate(foot.x)} ${coordinate(foot.y)}`);
        limb.foot.setAttribute('transform', `translate(${coordinate(foot.x)} ${coordinate(foot.y)})`);
      }

      function render() {
        const phase = (elapsed % geometry.period) / geometry.period;
        const angle = phase * Math.PI * 2;
        const rotation = phase * 360 * geometry.wheelRatio;
        wheels.forEach((wheel) => wheel.setAttribute('transform', `rotate(${coordinate(rotation)})`));
        drawLeg(limbs[0], angle);
        drawLeg(limbs[1], angle + Math.PI);
        // Positive dash offset moves the road to the left; wheel rotation is clockwise.
        const distance = (elapsed / geometry.period) * Math.PI * 2 * geometry.wheelRadius * geometry.wheelRatio;
        road.setAttribute('stroke-dashoffset', coordinate(distance % geometry.roadSpacing));
      }

      function tick(timestamp) {
        frameId = null;
        if (!playing || document.hidden) return;
        if (previousTimestamp !== null) {
          elapsed += Math.min(Math.max(timestamp - previousTimestamp, 0), 64);
        }
        previousTimestamp = timestamp;
        render();
        frameId = window.requestAnimationFrame(tick);
      }

      function syncScheduler() {
        if (frameId !== null) window.cancelAnimationFrame(frameId);
        frameId = null;
        previousTimestamp = null;
        if (playing && !document.hidden) frameId = window.requestAnimationFrame(tick);
      }

      function syncButton() {
        label.textContent = playing ? '暂停动画' : '播放动画';
        pauseIcon.toggleAttribute('hidden', !playing);
        playIcon.toggleAttribute('hidden', playing);
      }

      button.addEventListener('click', () => {
        playing = !playing;
        syncButton();
        syncScheduler();
      });
      document.addEventListener('visibilitychange', syncScheduler);
      motionPreference.addEventListener('change', (event) => {
        if (event.matches) {
          playing = false;
          syncButton();
          syncScheduler();
        }
      });

      render();
      syncButton();
      button.hidden = false;
      syncScheduler();
    })();
  </script>
</body>
</html>
